services:
  api:
    build: ./server
    ports:
      - 3000:3000
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - 1234:1234

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_contacts
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: